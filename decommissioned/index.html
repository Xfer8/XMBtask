<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#212121" />
    <title>XMBtask</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #212121;
        color: #f0f0f0;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 20%, rgba(45, 184, 106, 0.08), transparent 34rem),
          #212121;
      }

      main {
        width: min(100%, 480px);
        padding: 34px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        background: #292929;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.38);
      }

      .logo {
        margin-bottom: 30px;
        font-size: 22px;
        font-weight: 750;
        letter-spacing: -0.04em;
      }

      .logo span:first-child { color: #4ade80; }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        color: #9ca3af;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .status::before {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #4ade80;
        content: "";
        box-shadow: 0 0 12px rgba(74, 222, 128, 0.5);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(24px, 5vw, 32px);
        line-height: 1.12;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo"><span>XMB</span><span>task</span></div>
      <div class="status">Application retired</div>
      <h1>This workspace is offline.</h1>
      <p>XMBtask has been decommissioned and account access is closed while this site is prepared for its next use.</p>
    </main>
  </body>
</html>
